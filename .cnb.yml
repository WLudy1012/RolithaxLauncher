# CNB（cnb.cool）云构建配置：main push 构建 debug APK；v* tag 推送时构建签名 release APK 并发布 CNB Release。
# tag 流水线从密钥仓库 WLudy/Rolithax-secrets 的 keystore.yml 导入签名密钥
# （KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_PASSWORD），未导入时安全失败，不发布未签名包。
# 密钥仓库须为私有，且 keystore.yml 的 allow_slugs 需包含 WLudy/RolithaxLauncher。

main:
  push:
    - docker:
        image: mobiledevops/android-sdk-image:34.0.1
        volumes:
          - /root/.gradle:cow
          - /opt/android-sdk-linux/ndk:cow
      stages:
        - name: 预热 Android SDK（NDK）
          script: |
            set -eu
            export ANDROID_HOME=/opt/android-sdk-linux
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            SDKMAN=
            for candidate in "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMAN="$candidate"
                break
              fi
            done
            if [ -z "$SDKMAN" ]; then
              echo "ERROR: 未找到可执行的 sdkmanager" >&2
              exit 1
            fi
            echo "sdkmanager: $SDKMAN"
            yes | "$SDKMAN" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMAN" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools" \
              || echo "警告：platform/build-tools 预装失败，交由 AGP 自动下载" >&2
            NDK="$ANDROID_HOME/ndk/28.2.13676358"
            if [ -d "$NDK" ] && [ -f "$NDK/source.properties" ]; then
              echo "NDK 28.2.13676358 已缓存（$NDK）"
            else
              rm -rf "$NDK"
              yes | "$SDKMAN" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"
              test -f "$NDK/source.properties" || {
                echo "ERROR: NDK 安装完成后仍缺少 source.properties：$NDK" >&2
                exit 1
              }
            fi
        - name: 构建 Debug APK
          script: |
            set -eu
            export ANDROID_HOME=/opt/android-sdk-linux
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            export MSLX_MAVEN_GOOGLE_MIRROR=https://maven.aliyun.com/repository/google
            export MSLX_MAVEN_CENTRAL_MIRROR=https://maven.aliyun.com/repository/public
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
        - name: 收集 Debug APK
          script: |
            set -eu
            ls -lh app/build/outputs/apk/debug
            cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
            ls -lh app-debug.apk
        - name: 上传 Debug APK 附件
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - app-debug.apk

$:
  tag_push:
    - docker:
        image: mobiledevops/android-sdk-image:34.0.1
        volumes:
          - /root/.gradle:cow
          - /opt/android-sdk-linux/ndk:cow
      stages:
        - name: 预热 Android SDK（NDK）
          script: |
            set -eu
            export ANDROID_HOME=/opt/android-sdk-linux
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            SDKMAN=
            for candidate in "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then
                SDKMAN="$candidate"
                break
              fi
            done
            if [ -z "$SDKMAN" ]; then
              echo "ERROR: 未找到可执行的 sdkmanager" >&2
              exit 1
            fi
            yes | "$SDKMAN" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMAN" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools" \
              || echo "警告：platform/build-tools 预装失败，交由 AGP 自动下载" >&2
            NDK="$ANDROID_HOME/ndk/28.2.13676358"
            if [ -d "$NDK" ] && [ -f "$NDK/source.properties" ]; then
              echo "NDK 28.2.13676358 已缓存（$NDK）"
            else
              rm -rf "$NDK"
              yes | "$SDKMAN" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"
              test -f "$NDK/source.properties" || {
                echo "ERROR: NDK 安装完成后仍缺少 source.properties：$NDK" >&2
                exit 1
              }
            fi
        - name: 构建并校验签名 APK 和 JRE 附件
          imports:
            - https://cnb.cool/WLudy/Rolithax-secrets/-/blob/main/keystore.yml
          script: |
            set -eu
            export ANDROID_HOME=/opt/android-sdk-linux
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            export ANDROID_BUILD_TOOLS=35.0.0
            export MSLX_MAVEN_GOOGLE_MIRROR=https://maven.aliyun.com/repository/google
            export MSLX_MAVEN_CENTRAL_MIRROR=https://maven.aliyun.com/repository/public
            export RELEASE_TAG="${CNB_BRANCH:?缺少当前 Tag}"
            export RUNNER_TEMP="$PWD/.cnb-release"
            mkdir -p "$RUNNER_TEMP"
            chmod +x gradlew
            bash .github/scripts/prepare-android-release.sh
            (
              cd "$RUNNER_TEMP/release-assets"
              printf '\n## SHA-256\n\n| 文件 | SHA-256 |\n| --- | --- |\n'
              while read -r digest name; do
                printf '| `%s` | `%s` |\n' "${name#\*}" "$digest"
              done < SHA256SUMS.txt
            ) >> "$RUNNER_TEMP/release-assets/release-notes.md"

        - name: 创建 CNB Release
          type: git:release
          options:
            descriptionFromFile: .cnb-release/release-assets/release-notes.md
            latest: true

        - name: 上传 Release 附件
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - .cnb-release/release-assets/RolithaxLauncher.apk
              - .cnb-release/release-assets/jre8-universal.tar.xz
              - .cnb-release/release-assets/jre8-arm64-bin.tar.xz
              - .cnb-release/release-assets/jre8-x86_64-bin.tar.xz
              - .cnb-release/release-assets/jre17-arm64-20210825-release.tar.xz
              - .cnb-release/release-assets/jre17-x86_64-20210825-release.tar.xz
              - .cnb-release/release-assets/jre21-arm64-20260223-release.tar.xz
              - .cnb-release/release-assets/jre25-arm64-20260223-release.tar.xz
              - .cnb-release/release-assets/SHA256SUMS.txt
