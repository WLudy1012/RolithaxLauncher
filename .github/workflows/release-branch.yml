name: Release 分支发布

on:
  push:
    branches: ['release*', 'release/**']

permissions:
  contents: read

concurrency:
  group: release-branch
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: 校验版本
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 校验分支版本和已合并状态
        id: version
        run: |
          set -euo pipefail
          name=$(sed -E 's#^release[/_-]?##; s#^[vV]##' <<< "$GITHUB_REF_NAME")
          tag="v${name}"
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){1,3}(-Beta|-Force)?$ ]] || {
            echo "::error::Release 分支名无法解析为版本。示例：release-1.8.1 或 release/1.8.1-Beta"
            exit 1
          }
          version="${tag#v}"
          version="${version%-Beta}"
          version="${version%-Force}"
          version_in_gradle=$(sed -nE 's/^\s*versionName.*\?: *"([^"]+)".*$/\1/p' app/build.gradle.kts)
          [[ "$version_in_gradle" == "$version" ]] || {
            echo "::error::Gradle versionName 与分支版本不一致"
            exit 1
          }

          merged_sha=$(bash .github/scripts/find-release-merge.sh origin/main "$GITHUB_SHA" "$tag")
          existing_sha=$(git rev-parse -q --verify "refs/tags/$tag" || true)
          if [[ -n "$existing_sha" && "$existing_sha" != "$merged_sha" ]]; then
            echo "::error::版本标记已被其他提交使用"
            exit 1
          fi
          if [[ -z "$merged_sha" ]]; then
            code=$(sed -nE 's/^\s*versionCode *= *([0-9]+).*/\1/p' app/build.gradle.kts)
            main_code=$(git show origin/main:app/build.gradle.kts |
              sed -nE 's/^\s*versionCode *= *([0-9]+).*/\1/p')
            [[ "$code" =~ ^[0-9]+$ && "$main_code" =~ ^[0-9]+$ ]] && (( code > main_code )) || {
              echo "::error::versionCode 必须大于 main 上的值"
              exit 1
            }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: 构建验证
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/verify-android

  merge:
    name: 合并到 main 并打 tag
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 合并已验证提交并创建标记
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version_code() {
            sed -nE 's/^\s*versionCode *= *([0-9]+).*/\1/p'
          }
          code=$(version_code < app/build.gradle.kts)
          require_newer_code() {
            local base_code
            base_code=$(git show "$1:app/build.gradle.kts" | version_code)
            [[ "$code" =~ ^[0-9]+$ && "$base_code" =~ ^[0-9]+$ ]] && (( code > base_code )) || {
              echo "::error::versionCode 必须大于待合并的 main 提交"
              exit 1
            }
          }
          sha=$(bash .github/scripts/find-release-merge.sh origin/main "$GITHUB_SHA" "$TAG")
          if [[ -z "$sha" ]]; then
            live_head=$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)
            [[ "$live_head" == "$GITHUB_SHA" ]] || {
              echo "::error::Release 分支已更新，请使用新提交触发的验证结果"
              exit 1
            }
            pr=$(gh pr list --base main --head "$BRANCH" --state open \
              --json number,headRefOid,isCrossRepository \
              --jq "map(select(.headRefOid == \"$GITHUB_SHA\" and (.isCrossRepository | not))) | first | .number // empty")
            if [[ -z "$pr" ]]; then
              url=$(gh pr create --base main --head "$BRANCH" \
                --title "release: 发布 $TAG" --body "通过构建验证后合并并发布 $TAG。")
              pr="${url##*/}"
            fi
            for attempt in {1..12}; do
              git fetch origin refs/heads/main:refs/remotes/origin/main --quiet
              sha=$(bash .github/scripts/find-release-merge.sh origin/main "$GITHUB_SHA" "$TAG")
              [[ -z "$sha" ]] || break
              require_newer_code origin/main
              gh pr merge "$pr" --merge --match-head-commit "$GITHUB_SHA" --subject "release: 发布 $TAG" || true
              sha=$(gh pr view "$pr" --json state,mergeCommit --jq 'select(.state == "MERGED") | .mergeCommit.oid')
              [[ -z "$sha" ]] || break
              sleep 10
            done
            [[ -n "$sha" ]] || { echo "::error::PR 未合并，请检查状态检查与分支保护"; exit 1; }
            [[ "$(gh api "repos/$GH_REPO/git/commits/$sha" --jq '.parents[1].sha')" == "$GITHUB_SHA" ]] || {
              echo "::error::合并提交与验证提交不一致"
              exit 1
            }
            git fetch origin refs/heads/main:refs/remotes/origin/main --quiet
          fi
          require_newer_code "$sha^1"
          existing=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)
          if [[ -z "$existing" ]]; then
            gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$sha" >/dev/null
          elif [[ "$existing" != "$sha" ]]; then
            echo "::error::远端标记指向另一提交"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  release:
    name: 发布
    needs: [prepare, merge]
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      sha: ${{ needs.merge.outputs.sha }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
    permissions:
      contents: write

  cleanup:
    name: 清理已发布的分支
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: 删除已验证的 Release 分支
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          ref="refs/heads/$BRANCH"
          if ! git push --force-with-lease="$ref:$GITHUB_SHA" origin ":$ref"; then
            echo "::warning::未删除 Release 分支，分支可能已更新或受保护"
          fi
