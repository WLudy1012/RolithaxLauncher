name: 桌面持续集成

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      sha:
        description: 构建指定的提交
        type: string
        default: ''
      app-version:
        description: Windows 安装包显示的版本
        type: string
        default: ''
    outputs:
      linux-artifact-id:
        description: Linux 应用归档
        value: ${{ jobs.linux.outputs.artifact-id }}
      windows-installer-artifact-id:
        description: Windows x64 安装程序
        value: ${{ jobs.windows.outputs.installer-artifact-id }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  linux:
    name: Linux 桌面验证
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: 配置 JetBrains Runtime 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"
          java-package: jdk
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/dev' }}

      - name: 准备 Linux 显示环境与中文字体
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends xvfb xauth fonts-noto-cjk
          chmod +x gradlew

      - name: 测试并构建 Linux 应用
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew :shared:desktopTest :desktop:test :desktop:createDistributable --no-daemon --stacktrace

      - name: 归档 Linux 应用
        run: |
          set -euo pipefail
          app=desktop/build/compose/binaries/main/app
          test -x "$app/RolithaxLauncher/bin/RolithaxLauncher"
          test -s "$app/RolithaxLauncher/lib/runtime/lib/server/libjvm.so"
          mkdir -p desktop/build/outputs
          tar -C "$app" -czf desktop/build/outputs/RolithaxLauncher-Linux.tar.gz RolithaxLauncher

      - name: 上传 Linux 应用
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: RolithaxLauncher-Linux-${{ github.run_attempt }}
          path: desktop/build/outputs/RolithaxLauncher-Linux.tar.gz
          if-no-files-found: error
          compression-level: 0

      - name: 上传桌面测试结果与渲染样本
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-results-Linux-${{ github.run_attempt }}
          path: |
            desktop/build/reports/tests/test/
            desktop/build/test-results/test/
            desktop/build/visual-check/
            shared/build/reports/tests/desktopTest/
            shared/build/test-results/desktopTest/
          if-no-files-found: ignore

  windows:
    name: Windows 桌面验证
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      installer-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/windows/build/nuget-packages
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - name: 配置 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/dev' }}

      - name: 缓存 Kotlin/Native 工具链依赖
        uses: actions/cache@v5
        with:
          path: |
            ~/.konan/dependencies
            !~/.konan/dependencies/cache
          key: desktop-konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'shared/build.gradle.kts') }}

      - name: 配置 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 配置 .NET 10
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: "10.0"
          dotnet-quality: ga
          skip-lts-prepass: true

      - name: 缓存 NuGet 依赖
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: desktop-nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('windows/Rolithax.Windows.csproj', '**/NuGet.Config', '**/Directory.Build.*', '**/Directory.Packages.props') }}

      - name: 构建 Kotlin/Native 核心
        run: .\gradlew.bat '-Prolithax.windowsNative=true' '-Pkotlin.native.distribution.downloadFromMaven=true' :shared:linkReleaseSharedMingwX64 --no-daemon --stacktrace

      - name: 验证 C ABI
        run: python windows/tests/core_smoke.py shared/build/bin/mingwX64/releaseShared/rolithax_core.dll

      - name: 发布 WinUI 3 自包含应用
        working-directory: windows
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          if ($env:DOTNET_SDK_VERSION -notmatch '^10\.0\.\d+$') {
            throw '需要 .NET 10 正式版 SDK'
          }
          @{ sdk = @{ version = $env:DOTNET_SDK_VERSION; rollForward = 'disable' } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
          $core = (Resolve-Path '../shared/build/bin/mingwX64/releaseShared/rolithax_core.dll').Path
          dotnet publish Rolithax.Windows.csproj -c Release -r win-x64 --self-contained true -o build/RolithaxLauncher "-p:RolithaxCorePath=$core"

      - name: 验证 Windows 应用
        run: |
          $app = 'windows/build/RolithaxLauncher'
          $expected = @(
            'RolithaxLauncher.exe', 'RolithaxLauncher.pri', 'App.xbf', 'MainWindow.xbf',
            'coreclr.dll', 'Microsoft.UI.Xaml.dll', 'rolithax_core.dll',
            'legal/WindowsAppSDK-LICENSE.txt', 'legal/WindowsAppSDK-NOTICE.txt'
          )
          foreach ($name in $expected) {
            if ((Get-Item -LiteralPath (Join-Path $app $name)).Length -eq 0) {
              throw "发布文件为空：$name"
            }
          }
          $original = (Get-FileHash 'shared/build/bin/mingwX64/releaseShared/rolithax_core.dll').Hash
          if ((Get-FileHash "$app/rolithax_core.dll").Hash -ne $original) {
            throw 'WinUI 包内的 DLL 与通过 C ABI 测试的 DLL 不一致'
          }

      - name: 构建 Windows 安装程序
        env:
          APP_VERSION: ${{ inputs.app-version }}
        run: |
          $version = $env:APP_VERSION
          if ([string]::IsNullOrEmpty($version)) {
            $entry = Select-String -Path app/build.gradle.kts -Pattern '^\s*versionName\s*=.*\?:\s*"(?<version>[^"]+)"'
            if (!$entry) { throw '无法读取应用版本' }
            $version = $entry.Matches[0].Groups['version'].Value
          }
          ./windows/installer/build.ps1 -AppVersion $version -PublishDir windows/build/RolithaxLauncher -OutputDir windows/build/installer

      - name: 验证离线安装和卸载
        run: ./windows/installer/smoke.ps1 -Setup windows/build/installer/RolithaxLauncher-Windows-x64-Setup.exe

      - name: 上传 Windows 安装程序
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: RolithaxLauncher-Windows-Setup-${{ github.run_attempt }}
          path: windows/build/installer/RolithaxLauncher-Windows-x64-Setup.exe
          if-no-files-found: error
          compression-level: 0

      - name: 归档 Windows 便携版
        if: inputs.sha == ''
        run: Compress-Archive -LiteralPath windows/build/RolithaxLauncher -DestinationPath windows/build/RolithaxLauncher-Windows.zip

      - name: 上传 Windows 便携版
        if: inputs.sha == ''
        uses: actions/upload-artifact@v7
        with:
          name: RolithaxLauncher-Windows-${{ github.run_attempt }}
          path: windows/build/RolithaxLauncher-Windows.zip
          if-no-files-found: error
          compression-level: 0
