name: Rolithax 多平台发布

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 已存在的发布 tag
        required: true
        type: string
      sha:
        description: 已验证的合并提交
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true
      CNB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: rolithax-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: 核对发布版本与提交
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: 核对标记指向已验证提交
        id: source
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}(-Beta|-Force)?$ ]]
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          commit=$(git rev-parse --verify "$RELEASE_SHA^{commit}")
          [[ "$(git rev-parse HEAD)" == "$commit" ]] || {
            echo "::error::发布 tag 已移动"
            exit 1
          }
          version="${RELEASE_TAG#v}"
          base_version="${version%-Beta}"
          base_version="${base_version%-Force}"
          gradle_version=$(sed -nE 's/^[[:space:]]*versionName.*\?: *"([^"]+)".*$/\1/p' app/build.gradle.kts)
          [[ "$gradle_version" == "$base_version" ]] || {
            echo "::error::Gradle versionName 与发布 tag 不一致"
            exit 1
          }
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: 构建并校验签名 APK
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-android
        id: android

      - name: 构建和校验发布附件
        env:
          ANDROID_BUILD_TOOLS: ${{ steps.android.outputs.build-tools }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/prepare-android-release.sh

      - name: 保存签名产物
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  desktop:
    name: 构建 Windows 和 Linux
    needs: source
    uses: ./.github/workflows/desktop.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      app-version: ${{ needs.source.outputs.version }}

  publish:
    name: 发布三端附件
    needs: [source, build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-input/android

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.desktop.outputs.windows-installer-artifact-id }}
          path: ${{ runner.temp }}/release-input/windows

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.desktop.outputs.linux-artifact-id }}
          path: ${{ runner.temp }}/release-input/linux

      - name: 汇总校验值并发布 Release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh "$RUNNER_TEMP/release-input"

  sync:
    name: 同步 CNB
    needs: [source, publish]
    uses: ./.github/workflows/cnb-sync.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      sha: ${{ needs.source.outputs.sha }}
    secrets:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
