name: Android 发布

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 已存在的发布 tag
        required: true
        type: string
      sha:
        description: 已验证的合并提交
        required: true
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true
      CNB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建并校验签名 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha: ${{ steps.source.outputs.sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: 核对标记指向已验证提交
        id: source
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          commit=$(git rev-parse --verify "$RELEASE_SHA^{commit}")
          [[ "$(git rev-parse HEAD)" == "$commit" ]] || {
            echo "::error::发布 tag 已移动"
            exit 1
          }
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-android
        id: android

      - name: 构建和校验发布附件
        env:
          ANDROID_BUILD_TOOLS: ${{ steps.android.outputs.build-tools }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/prepare-android-release.sh

      - name: 保存签名产物
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: 发布已校验的附件
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets

      - name: 发布 Release
        working-directory: release-assets
        run: |
          set -euo pipefail
          check_tag() {
            [[ "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" == "$RELEASE_SHA" ]] || {
              echo "::error::发布 tag 已移动"
              exit 1
            }
          }
          check_tag
          sha256sum --strict --check SHA256SUMS.txt
          assets=(app-release.apk app-release-lite.apk jre17-arm64-20210825-release.tar.xz SHA256SUMS.txt)
          for asset in jre21-arm64-20260223-release.tar.xz jre25-arm64-20260223-release.tar.xz; do
            [[ ! -f "$asset" ]] || assets+=("$asset")
          done
          prerelease=false
          [[ "$RELEASE_TAG" != *-Beta ]] || prerelease=true
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/released-assets"
            if [[ "$state" == false ]]; then
              for asset in app-release.apk app-release-lite.apk jre17-arm64-20210825-release.tar.xz; do
                grep -Fxq "$asset" "$RUNNER_TEMP/released-assets" || {
                  echo "::error::已发布的 Release 缺少必需附件 $asset"
                  exit 1
                }
              done
              echo "Release 已发布，保留现有附件。"
              exit 0
            fi
            for asset in jre21-arm64-20260223-release.tar.xz jre25-arm64-20260223-release.tar.xz; do
              if [[ ! -f "$asset" ]] && grep -Fxq "$asset" "$RUNNER_TEMP/released-assets"; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --draft \
              --title "Rolithax Launcher $RELEASE_TAG" --notes-file release-notes.md --prerelease="$prerelease"
          fi
          check_tag
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease" \
            --title "Rolithax Launcher $RELEASE_TAG" --notes-file release-notes.md

  sync:
    name: 同步 CNB
    needs: [build, publish]
    uses: ./.github/workflows/cnb-sync.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      sha: ${{ needs.build.outputs.sha }}
    secrets:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
