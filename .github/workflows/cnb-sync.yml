name: 同步 CNB 源码

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: 可选的发布 tag
        type: string
        default: ''
      sha:
        description: 发布 tag 对应的提交
        type: string
        default: ''
    secrets:
      CNB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: cnb-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    name: 同步到 CNB
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 同步 main 和发布标记
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CNB_TOKEN:-}" ]]; then
            echo "::warning::未配置 CNB_TOKEN，跳过镜像同步"
            exit 0
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}(-Beta|-Force)?$ ]]
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --quiet
            [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" == "$RELEASE_SHA" ]] || {
              echo "::error::发布 tag 已移动"
              exit 1
            }
          fi
          authorization=$(printf 'cnb:%s' "$CNB_TOKEN" | base64 -w0)
          echo "::add-mask::$authorization"
          unset CNB_TOKEN
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://cnb.cool/.extraheader
          export GIT_CONFIG_VALUE_0="Authorization: Basic $authorization"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add cnb https://cnb.cool/WLudy/RolithaxLauncher.git
          for attempt in 1 2 3; do
            git fetch cnb refs/heads/main:refs/remotes/cnb/main --quiet
            if ! git merge --no-edit refs/remotes/cnb/main; then
              echo "::error::CNB main 合并冲突，请手动处理"
              exit 1
            fi
            if git push cnb HEAD:refs/heads/main; then
              if [[ -n "$RELEASE_TAG" ]]; then
                git push cnb "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              fi
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo "::error::无法同步 CNB main"
          exit 1
