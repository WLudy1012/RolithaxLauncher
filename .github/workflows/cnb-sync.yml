name: 同步 CNB 源码

# main 通过 Pull Request 更新后，把源码同步到 CNB 镜像。
# 由 release* 分支流程合并时不会触发 push 事件，该流程在发布步骤里自行同步。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cnb-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 同步到 CNB
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 合并 CNB main 并推送
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::warning::未配置 CNB_TOKEN，跳过 CNB main 源码同步。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/WLudy/RolithaxLauncher.git"
          git fetch cnb refs/heads/main:refs/remotes/cnb/main --quiet
          git merge --no-edit --no-ff refs/remotes/cnb/main
          git push cnb "HEAD:refs/heads/main"
