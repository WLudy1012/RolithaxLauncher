name: 准备 Android 构建环境
description: 配置 JDK 17、Android SDK 和 Gradle 缓存

inputs:
  gradle-cache-read-only:
    description: 只读取 Gradle 与 NDK 缓存
    default: "true"

outputs:
  build-tools:
    description: 用于构建与签名验证的 Android Build Tools 版本
    value: ${{ steps.sdk.outputs.build-tools }}

runs:
  using: composite
  steps:
    - name: 准备 Gradle Wrapper
      shell: bash
      run: |
        chmod +x gradlew

    - name: 配置 JDK 17
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "17"

    - name: 读取 SDK 配置
      id: sdk
      shell: bash
      run: |
        set -euo pipefail
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        compile_sdk=$(sed -nE 's/^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts)
        ndk_version=$(sed -nE 's/^[[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*"([0-9.]+)".*/\1/p' app/build.gradle.kts)
        # AGP 8.7 的默认 Build Tools 版本。
        build_tools=$(sed -nE 's/^[[:space:]]*buildToolsVersion[[:space:]]*=[[:space:]]*"([0-9.]+)".*/\1/p' app/build.gradle.kts)
        build_tools="${build_tools:-34.0.0}"
        if [[ ! -d "$sdk_root" || ! "$compile_sdk" =~ ^[0-9]+$ ||
          ! "$ndk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || ! "$build_tools" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::无法确定 Android SDK 路径或组件版本"
          exit 1
        fi
        {
          echo "ANDROID_HOME=$sdk_root"
          echo "ANDROID_SDK_ROOT=$sdk_root"
        } >> "$GITHUB_ENV"
        {
          echo "compile-sdk=$compile_sdk"
          echo "build-tools=$build_tools"
          echo "ndk-version=$ndk_version"
          echo "ndk-path=$sdk_root/ndk/$ndk_version"
        } >> "$GITHUB_OUTPUT"

    - name: 恢复 Android NDK 缓存
      id: ndk-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.sdk.outputs.ndk-path }}
        key: android-ndk-${{ steps.sdk.outputs.ndk-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: 安装缺失的 SDK 组件
      shell: bash
      env:
        COMPILE_SDK: ${{ steps.sdk.outputs.compile-sdk }}
        BUILD_TOOLS: ${{ steps.sdk.outputs.build-tools }}
        NDK_VERSION: ${{ steps.sdk.outputs.ndk-version }}
        NDK_PATH: ${{ steps.sdk.outputs.ndk-path }}
      run: |
        set -euo pipefail
        packages=()
        [[ -f "$ANDROID_HOME/platforms/android-$COMPILE_SDK/android.jar" ]] || packages+=("platforms;android-$COMPILE_SDK")
        [[ -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" ]] || packages+=("build-tools;$BUILD_TOOLS")
        [[ -x "$NDK_PATH/ndk-build" ]] || packages+=("ndk;$NDK_VERSION")

        if ((${#packages[@]})); then
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" && -d "$ANDROID_HOME/cmdline-tools" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -executable | sort -V | tail -n 1)
          fi
          if [[ ! -x "$sdkmanager" ]]; then
            echo "::error::未找到 sdkmanager，无法安装缺失的 Android SDK 组件"
            exit 1
          fi
          # 采用 sdkmanager 的返回码，避免 yes 在管道关闭时误报失败。
          (set +o pipefail; yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null)
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "${packages[@]}"
        fi

        test -f "$ANDROID_HOME/platforms/android-$COMPILE_SDK/android.jar"
        test -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
        test -x "$NDK_PATH/ndk-build"

    - name: 保存 Android NDK 缓存
      if: inputs.gradle-cache-read-only == 'false' && steps.ndk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.sdk.outputs.ndk-path }}
        key: ${{ steps.ndk-cache.outputs.cache-primary-key }}

    - name: 配置 Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
