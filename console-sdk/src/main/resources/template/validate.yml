name: 验证控制台插件
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.ROLITHAX_SDK_REPOSITORY || 'WLudy1012/RolithaxLauncher' }}
          ref: ${{ vars.ROLITHAX_SDK_REF || 'main' }}
          path: .rolithax-sdk
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: 构建 SDK
        working-directory: .rolithax-sdk
        run: bash gradlew :console-sdk:installDist
      - name: 校验、回放与打包
        run: |
          sdk=.rolithax-sdk/console-sdk/build/install/rolithax-console-sdk/bin/rolithax-console-sdk
          "$sdk" validate .
          "$sdk" replay . fixtures/logs.txt fixtures/expected.json
          "$sdk" pack . console-plugin.zip
      - uses: actions/upload-artifact@v7
        with:
          name: console-plugin
          path: console-plugin.zip
